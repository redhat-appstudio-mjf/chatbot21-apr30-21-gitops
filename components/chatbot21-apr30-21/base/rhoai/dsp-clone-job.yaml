apiVersion: batch/v1
kind: Job
metadata:
  name: dsp-clone-job-chatbot21-apr30-21-gitops
spec:
  template:
    metadata:
      name: dsp-clone-job-chatbot21-apr30-21-gitops
    spec:
      serviceAccountName: chatbot21-apr30-21-dsp-job
      containers:
        - name: initialize-dsp
          image: quay.io/redhat-ai-dev/utils:latest
          command:
            - /bin/bash
            - -c
            - |
              NS=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
              oc wait -l statefulset=chatbot21-apr30-21-notebook --for=condition=ready pod --timeout=300s
              oc exec  StatefulSet/chatbot21-apr30-21-notebook -- git clone https://github.com/redhat-appstudio-mjf/chatbot21-apr30-21
      restartPolicy: Never
